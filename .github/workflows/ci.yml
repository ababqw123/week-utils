name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }} / ${{ matrix.timezone }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, os: ubuntu-latest, timezone: UTC }
          - { node: 24, os: ubuntu-latest, timezone: Asia/Seoul }
          - { node: 24, os: ubuntu-latest, timezone: America/New_York }
          - { node: 24, os: windows-latest, timezone: Asia/Seoul }
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
